<style>
  :root {
    --mcolor: #35BDB2;
    --mcolor-dark: #2aa39a;
    --scolor: #F9B337;
    --scolor-dark: #e0a02a;
    --bead-top: #F9B337;
    --bead-top-dark: #d99a2a;
    --bead-bottom: #35BDB2;
    --bead-bottom-dark: #2aa39a;
    --frame: #8B5A2B;
    --frame-dark: #6b4520;
    --dark: #2c3e50;
    --grey: #f0f4f8;
    --error: #ff6b6b;
    --success: #4cd964;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #fff5e0 0%, #e0f7f5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: var(--dark);
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 400px; height: 400px;
    background: var(--scolor);
    top: -150px; left: -150px;
  }
  body::after {
    width: 350px; height: 350px;
    background: var(--mcolor);
    bottom: -120px; right: -120px;
  }

  .game {
    background: #fff;
    border-radius: 32px;
    box-shadow: 0 24px 64px rgba(249, 179, 55, 0.2), 0 4px 12px rgba(0,0,0,0.04);
    padding: 28px 22px 26px;
    max-width: 820px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .mascot {
    width: 70px;
    height: 70px;
    margin: 0 auto 8px;
    transition: transform 0.3s ease;
  }
  .mascot img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .mascot.happy { animation: bounce 0.5s ease; }
  .mascot.sad { animation: shake 0.5s ease; }

  .game__title { font-size: 24px; font-weight: 900; margin-bottom: 4px; letter-spacing: -0.5px; }
  .game__subtitle { font-size: 14px; color: #8899a6; margin-bottom: 16px; }

  .game__hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 10px 16px;
    background: var(--grey);
    border-radius: 16px;
    font-size: 14px;
    font-weight: 700;
  }
  .hud__item { display: flex; align-items: center; gap: 6px; }
  .hud__item i { font-size: 16px; }
  .hud__item--score i { color: var(--scolor); }
  .hud__item--progress i { color: var(--mcolor); }
  .hud__value { color: var(--dark); font-weight: 900; font-size: 17px; }

  .stars { display: flex; justify-content: center; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .star { font-size: 16px; color: #e0e6ed; transition: all 0.3s ease; }
  .star.filled { color: var(--scolor); animation: pop 0.4s ease; text-shadow: 0 2px 6px rgba(249, 179, 55, 0.4); }

  /* ЗАДАНИЕ */
  .task {
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 14px;

  .task__number {

    border-radius: 8px;
    font-size: 28px;
    min-width: 60px;

  .task__label { font-size: 15px; color: #8899a6; font-weight: 700; display: block; margin-bottom: 6px; }

  /* АБАКУС */

    display: flex;
    justify-content: center;
    margin: 18px 0 22px;
    padding: 28px 16px 40px;
    background: linear-gradient(180deg, #fdf4e3 0%, #fae8c8 100%);
    border-radius: 22px;
    border: 4px solid var(--frame);
    box-shadow: inset 0 4px 12px rgba(139, 90, 43, 0.15);
    position: relative;
  }

  .abacus {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .column {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 60px;
    position: relative;
  }

  /* Разделительная планка */
  .column__bar {
    position: absolute;
    left: -6px;
    right: -6px;
    height: 8px;
    background: var(--frame);
    border-radius: 4px;
    top: 40%;
    z-index: 3;
    box-shadow: 0 2px 4px rgba(139, 90, 43, 0.3);
  }

  /* Стержень */
  .column__rod {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    background: linear-gradient(90deg, #a07040 0%, #c49060 50%, #a07040 100%);
    border-radius: 2px;
    z-index: 0;
  }

  /* Зона для косточек */
  .column__top, .column__bottom {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .column__top {
    flex: 0 0 40%;
    justify-content: flex-end;
    padding-bottom: 10px;
  }
  .column__bottom {
    flex: 1;
    justify-content: flex-start;
    padding-top: 10px;
    min-height: 130px;
  }

  /* Косточка */
  .bead {
    width: 46px;
    height: 24px;
    border-radius: 50% / 55%;
    cursor: pointer;
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s, box-shadow 0.2s;
    position: relative;
    box-shadow: 0 3px 6px rgba(0,0,0,0.18), inset 0 -3px 4px rgba(0,0,0,0.15), inset 0 3px 3px rgba(255,255,255,0.45);
    user-select: none;
  }
  .bead:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.25), inset 0 -3px 4px rgba(0,0,0,0.15), inset 0 3px 3px rgba(255,255,255,0.45); }
  .bead:active { transform: scale(0.94); }

  /* Верхняя (небесная) косточка */
  .bead--top {
    background: linear-gradient(180deg, #ffd166 0%, var(--bead-top) 50%, var(--bead-top-dark) 100%);
  }
  .bead--top.active {
    transform: translateY(26px);
  }
  .bead--top.active:active { transform: translateY(26px) scale(0.94); }

  /* Нижние (земные) косточки */
  .bead--bottom {
    background: linear-gradient(180deg, #6fe0d6 0%, var(--bead-bottom) 50%, var(--bead-bottom-dark) 100%);
  }

  /* Метки разрядов */
  .column__label {
    font-size: 12px;
    color: #a07200;
    font-weight: 900;
    margin-top: 4px;
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);

  /* Текущее значение */

  .current-value__number {

  /* КНОПКИ */
  .actions {
    display: flex;

  .btn {
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 900;

    border-radius: 16px;

    font-family: inherit;
    box-shadow: 0 6px 0 var(--scolor-dark), 0 10px 20px rgba(249, 179, 55, 0.3);
    display: inline-flex;
    align-items: center;
    gap: 8px;

  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--scolor-dark), 0 14px 24px rgba(249, 179, 55, 0.35); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--scolor-dark), 0 4px 8px rgba(249, 179, 55, 0.3); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 0 4px 0 var(--scolor-dark); }
  .btn--teal {
    background: var(--mcolor);
    box-shadow: 0 6px 0 var(--mcolor-dark), 0 10px 20px rgba(53, 189, 178, 0.3);
  }
  .btn--teal:hover:not(:disabled) { box-shadow: 0 8px 0 var(--mcolor-dark), 0 14px 24px rgba(53, 189, 178, 0.35); }
  .btn--teal:active:not(:disabled) { box-shadow: 0 2px 0 var(--mcolor-dark), 0 4px 8px rgba(53, 189, 178, 0.3); }
  .btn--teal:disabled { box-shadow: 0 4px 0 var(--mcolor-dark); }
  .btn--ghost {
    background: var(--grey);
    color: var(--dark);
    box-shadow: 0 6px 0 #d0d8e0, 0 10px 20px rgba(0,0,0,0.05);

  /* ЭКРАНЫ */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.4s ease; }

  .start-features {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 16px 0 22px;
    flex-wrap: wrap;

  .start-feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;

  .start-feature i { font-size: 24px; color: var(--scolor); }
  .start-feature:nth-child(2) i { color: var(--mcolor); }
  .start-feature:nth-child(3) i { color: #9b59b6; }

  .record-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: linear-gradient(135deg, #fff7e0, #ffeeb8);
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    color: #a07200;
    margin-bottom: 16px;

  /* ФИНАЛ */

  .result__stats { display: flex; justify-content: center; gap: 12px; margin: 20px 0 24px; }
  .result__stat { flex: 1; padding: 14px 8px; background: var(--grey); border-radius: 16px; }
  .result__stat i { font-size: 20px; margin-bottom: 4px; display: block; }
  .result__stat:nth-child(1) i { color: var(--scolor); }
  .result__stat:nth-child(2) i { color: var(--success); }
  .result__stat:nth-child(3) i { color: var(--mcolor); }
  .result__stat-value { font-size: 24px; font-weight: 900; line-height: 1.1; }
  .result__stat-label { font-size: 11px; color: #8899a6; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .new-record {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px;
    background: linear-gradient(135deg, #ffe0e6, #ffd0d9);
    border-radius: 50px;
    font-size: 14px; font-weight: 900; color: #c0392b;

  .new-record i { color: #ff8fb1; }

  .feedback {
    font-size: 16px;
    font-weight: 900;
    min-height: 24px;
    margin-bottom: 10px;
    transition: color 0.2s;
  }
  .feedback.correct { color: var(--success); }
  .feedback.wrong { color: var(--error); }

  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pop { 0%{transform:scale(0.6)} 60%{transform:scale(1.15)} 100%{transform:scale(1)} }
  @keyframes bounce {
    0%,100%{transform:translateY(0)} 30%{transform:translateY(-12px)} 60%{transform:translateY(-4px)}
  }

  @media (max-width: 600px) {
    .game { padding: 20px 14px 20px; border-radius: 24px; }
    .game__title { font-size: 20px; }
    .mascot { width: 60px; height: 60px; }
    .abacus-wrap { padding: 20px 8px 32px; }
    .abacus { gap: 6px; }
    .column { width: 48px; }
    .bead { width: 38px; height: 20px; }
    .bead--top.active { transform: translateY(22px); }
    .bead--top.active:active { transform: translateY(22px) scale(0.94); }
    .column__bottom { min-height: 110px; }
    .task__number { font-size: 24px; padding: 3px 12px; }
    .current-value__number { font-size: 26px; padding: 3px 12px; }
    .btn { padding: 12px 20px; font-size: 14px; border-radius: 14px; }
    .result__title { font-size: 22px; }
    .result__stat-value { font-size: 20px; }
    .column__label { font-size: 10px; bottom: -18px; }
  }

  @media (max-width: 380px) {
    .column { width: 40px; }
    .bead { width: 32px; height: 17px; }
    .abacus { gap: 4px; }
    .bead--top.active { transform: translateY(19px); }
    .bead--top.active:active { transform: translateY(19px) scale(0.94); }
    .column__bottom { min-height: 95px; }
  }
</style>

<body>

<div class="game">

  <!-- ЭКРАН 1: СТАРТ -->

<script>
(function() {
  'use strict';

  const TOTAL_TASKS = 10;
  const MAX_COLUMNS = 5; // разряды: единицы, десятки, сотни, тысячи, десятки тысяч
  const RECORD_KEY = 'uniqumkids_abakus_record';

  const state = {
    score: 0,
    correct: 0,
    currentTask: 0,
    targetNumber: 0,
    currentNumber: 0,
    columns: [], // массив значений каждого разряда (0..9)
    startTime: 0,
    locked: false
  };

  const els = {
    screens: {
      start: document.getElementById('screen-start'),
      game: document.getElementById('screen-game'),
      result: document.getElementById('screen-result')
    },
    hudScore: document.getElementById('hud-score'),
    hudProgress: document.getElementById('hud-progress'),
    stars: document.getElementById('stars'),
    taskNumber: document.getElementById('task-number'),
    abacus: document.getElementById('abacus'),
    currentValue: document.getElementById('current-value'),
    feedback: document.getElementById('feedback'),
    mascotGame: document.getElementById('mascot-game'),
    resultTitle: document.getElementById('result-title'),
    resultText: document.getElementById('result-text'),
    resultScore: document.getElementById('result-score'),
    resultCorrect: document.getElementById('result-correct'),
    resultTime: document.getElementById('result-time'),
    btnStart: document.getElementById('btn-start'),
    btnRestart: document.getElementById('btn-restart'),
    btnReset: document.getElementById('btn-reset'),
    btnCheck: document.getElementById('btn-check'),
    recordContainer: document.getElementById('record-container'),
    recordResult: document.getElementById('record-result')
  };

  // ===== ЗВУК =====
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { return null; }
    }
    return audioCtx;
  }
  function playTone(freq, duration, type) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration);
  }
  function soundClick() { playTone(600, 0.05, 'triangle'); }
  function soundCorrect() { playTone(660, 0.12); setTimeout(() => playTone(880, 0.15), 100); }
  function soundWrong() { playTone(220, 0.2, 'sawtooth'); }
  function soundFinish() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2), i * 120));
  }

  // ===== УТИЛИТЫ =====
  function showScreen(name) {
    Object.values(els.screens).forEach(s => s.classList.remove('active'));
    els.screens[name].classList.add('active');
  }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  // ===== РЕКОРД =====
  function getRecord() {
    try { return parseInt(localStorage.getItem(RECORD_KEY) || '0', 10); }
    catch(e) { return 0; }
  }
  function saveRecord(score) {
    try {
      const current = getRecord();
      if (score > current) { localStorage.setItem(RECORD_KEY, String(score)); return true; }
    } catch(e) {}
    return false;
  }
  function renderStartRecord() {
    const rec = getRecord();
    els.recordContainer.innerHTML = rec > 0
      ? `<div class="record-badge"><i class="fa-solid fa-trophy"></i> Твой рекорд: ${rec} очков</div>`
      : '';
  }
  function renderResultRecord(isNew) {
    if (isNew) {
      els.recordResult.innerHTML = `<div class="new-record"><i class="fa-solid fa-trophy"></i> Новый рекорд!</div>`;
    } else {
      const rec = getRecord();
      els.recordResult.innerHTML = rec > 0
        ? `<div class="record-badge"><i class="fa-solid fa-trophy"></i> Твой рекорд: ${rec} очков</div>`
        : '';
    }
  }

  // ===== ЗВЁЗДЫ =====
  function renderStars() {
    els.stars.innerHTML = '';
    for (let i = 0; i < TOTAL_TASKS; i++) {
      const star = document.createElement('i');
      star.className = 'fa-solid fa-star star' + (i < state.currentTask ? ' filled' : '');
      els.stars.appendChild(star);
    }
  }

  // ===== ГЕНЕРАЦИЯ ЗАДАНИЯ =====
  function generateTask() {
    // Сложность растёт: 1 разряд → 5 разрядов
    let digits;
    if (state.currentTask < 2) digits = 1;
    else if (state.currentTask < 4) digits = 2;
    else if (state.currentTask < 6) digits = 3;
    else if (state.currentTask < 8) digits = 4;
    else digits = 5;

    const min = digits === 1 ? 1 : Math.pow(10, digits - 1);
    const max = Math.pow(10, digits) - 1;
    return rand(min, max);
  }

  // ===== РЕНДЕР АБАКУСА =====
  function renderAbacus() {
    els.abacus.innerHTML = '';
    state.columns.forEach((value, colIndex) => {
      const column = document.createElement('div');
      column.className = 'column';

      const rod = document.createElement('div');
      rod.className = 'column__rod';
      column.appendChild(rod);

      const bar = document.createElement('div');
      bar.className = 'column__bar';
      column.appendChild(bar);

      // Верхняя зона (небесная косточка)
      const topZone = document.createElement('div');
      topZone.className = 'column__top';

      const topBead = document.createElement('div');
      topBead.className = 'bead bead--top';
      if (value >= 5) topBead.classList.add('active');
      topBead.dataset.col = colIndex;
      topBead.dataset.type = 'top';
      topBead.addEventListener('click', () => toggleTop(colIndex));
      topZone.appendChild(topBead);

      column.appendChild(topZone);

      // Нижняя зона (земные косточки)
      const bottomZone = document.createElement('div');
      bottomZone.className = 'column__bottom';

      const bottomCount = value % 5;
      // 4 косточки, сверху вниз. Активные — те, что ближе к планке.
      for (let i = 0; i < 4; i++) {
        const bead = document.createElement('div');
        bead.className = 'bead bead--bottom';
        if (i < bottomCount) bead.classList.add('active');
        bead.dataset.col = colIndex;
        bead.dataset.index = i;
        bead.dataset.type = 'bottom';
        bead.addEventListener('click', () => clickBottom(colIndex, i));
        bottomZone.appendChild(bead);
      }

      column.appendChild(bottomZone);

      // Метка разряда
      const label = document.createElement('div');
      label.className = 'column__label';
      const labels = ['ед.', 'дес.', 'сот.', 'тыс.', 'д.т.'];
      label.textContent = labels[colIndex] || '';
      column.appendChild(label);

      els.abacus.appendChild(column);
    });

    updateCurrentValue();
  }

  // ===== ПЕРЕКЛЮЧЕНИЕ НЕБЕСНОЙ КОСТОЧКИ =====
  function toggleTop(colIndex) {
    if (state.locked) return;
    const value = state.columns[colIndex];
    if (value >= 5) {
      state.columns[colIndex] = value - 5;
    } else {
      state.columns[colIndex] = value + 5;
    }
    soundClick();
    updateColumnVisual(colIndex);
    updateCurrentValue();
  }

  // ===== КЛИК ПО ЗЕМНОЙ КОСТОЧКЕ =====
  function clickBottom(colIndex, beadIndex) {
    if (state.locked) return;
    const value = state.columns[colIndex];
    const currentBottom = value % 5; // 0..4

    let newBottom;
    if (beadIndex < currentBottom) {
      // Кликнули по активной — опускаем её и все ниже
      newBottom = beadIndex;
    } else {
      // Кликнули по неактивной — поднимаем её и все выше
      newBottom = beadIndex + 1;
    }

    state.columns[colIndex] = (value >= 5 ? 5 : 0) + newBottom;
    soundClick();
    updateColumnVisual(colIndex);
    updateCurrentValue();
  }

  // ===== ОБНОВЛЕНИЕ ВИЗУАЛА ОДНОГО РАЗРЯДА =====
  function updateColumnVisual(colIndex) {
    const value = state.columns[colIndex];
    const column = els.abacus.children[colIndex];
    if (!column) return;

    const topBead = column.querySelector('.bead--top');
    const bottomBeads = column.querySelectorAll('.bead--bottom');

    if (value >= 5) topBead.classList.add('active');
    else topBead.classList.remove('active');

    const bottomCount = value % 5;
    bottomBeads.forEach((bead, i) => {
      if (i < bottomCount) bead.classList.add('active');
      else bead.classList.remove('active');
    });
  }

  // ===== ТЕКУЩЕЕ ЗНАЧЕНИЕ =====
  function updateCurrentValue() {
    let num = 0;
    const len = state.columns.length;
    for (let i = 0; i < len; i++) {
      // i = 0 — единицы (правый разряд), i = len-1 — старший
      num += state.columns[i] * Math.pow(10, i);
    }
    state.currentNumber = num;
    els.currentValue.textContent = num;
  }

  // ===== СБРОС =====
  function resetAbacus() {
    if (state.locked) return;
    state.columns = new Array(MAX_COLUMNS).fill(0);
    renderAbacus();
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    soundClick();
  }

  // ===== ПРОВЕРКА =====
  function checkAnswer() {
    if (state.locked) return;
    state.locked = true;

    const isCorrect = state.currentNumber === state.targetNumber;

    if (isCorrect) {
      state.score += 10;
      state.correct += 1;
      els.hudScore.textContent = state.score;
      els.feedback.textContent = 'Верно!';
      els.feedback.className = 'feedback correct';
      els.mascotGame.classList.add('happy');
      soundCorrect();
    } else {
      els.feedback.textContent = `Не совсем. Ты набрал ${state.currentNumber}, нужно ${state.targetNumber}`;
      els.feedback.className = 'feedback wrong';
      els.mascotGame.classList.add('sad');
      soundWrong();
    }

    setTimeout(() => {
      els.mascotGame.classList.remove('happy', 'sad');
      state.currentTask++;
      renderStars();
      if (state.currentTask >= TOTAL_TASKS) {
        finishGame();
      } else {
        nextTask();
      }
    }, 1600);
  }

  // ===== СЛЕДУЮЩЕЕ ЗАДАНИЕ =====
  function nextTask() {
    state.locked = false;
    els.hudProgress.textContent = `${state.currentTask + 1}/${TOTAL_TASKS}`;
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    state.targetNumber = generateTask();
    els.taskNumber.textContent = state.targetNumber;
    resetAbacus();
  }

  // ===== ФИНАЛ =====
  function finishGame() {
    const elapsed = Math.round((Date.now() - state.startTime) / 1000);
    const percent = Math.round((state.correct / TOTAL_TASKS) * 100);

    els.resultScore.textContent = state.score;
    els.resultCorrect.textContent = `${state.correct}/${TOTAL_TASKS}`;
    els.resultTime.textContent = `${elapsed}с`;

    if (percent === 100) {
      els.resultTitle.textContent = 'Идеально!';
      els.resultText.textContent = 'Ты набрал все числа без ошибок!';
    } else if (percent >= 70) {
      els.resultTitle.textContent = 'Отличный результат!';
      els.resultText.textContent = 'Ты хорошо управляешься с абакусом.';
    } else if (percent >= 40) {
      els.resultTitle.textContent = 'Хорошо!';
      els.resultText.textContent = 'Продолжай тренироваться — будет ещё лучше.';
    } else {
      els.resultTitle.textContent = 'Есть куда расти!';
      els.resultText.textContent = 'Попробуй ещё раз — с каждым разом будет получаться лучше.';
    }

    const isNewRecord = saveRecord(state.score);
    renderResultRecord(isNewRecord);
    soundFinish();
    showScreen('result');
  }

  // ===== СТАРТ =====
  function startGame() {
    state.score = 0;
    state.correct = 0;
    state.currentTask = 0;
    state.startTime = Date.now();
    state.locked = false;
    state.columns = new Array(MAX_COLUMNS).fill(0);

    els.hudScore.textContent = '0';
    els.hudProgress.textContent = `1/${TOTAL_TASKS}`;
    renderStars();
    showScreen('game');
    nextTask();
  }

  els.btnStart.addEventListener('click', startGame);
  els.btnRestart.addEventListener('click', startGame);
  els.btnReset.addEventListener('click', resetAbacus);
  els.btnCheck.addEventListener('click', checkAnswer);

  renderStartRecord();
})();
</script>

</body>
</html>
